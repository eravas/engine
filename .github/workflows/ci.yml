name: ci

on:
  push:
  pull_request:

jobs:
  host-headless:
    name: host-headless (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset host-headless
      - name: Build
        run: cmake --build --preset host-headless
      - name: Test
        run: ctest --preset host-headless
      - name: Todo tests (reported, never fatal)
        if: always()
        run: |
          set +e
          ctest --preset todo > todo.log 2>&1
          status=$?
          cat todo.log
          {
            echo "### todo tests (${{ matrix.cc }}): not required to pass"
            echo '```'
            grep -E 'Test +#|tests passed' todo.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=todo tests (${{ matrix.cc }})::$(grep -E 'tests passed' todo.log || echo 'did not run')"
          fi
          exit 0

  host-sdl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev
      - name: Configure
        run: cmake --preset host-sdl
      - name: Build
        run: cmake --build --preset host-sdl
      - name: Smoke run on dummy drivers
        run: ctest --preset host-sdl

  rp2350:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: cmake --preset rp2350
      - name: Build
        run: cmake --build --preset rp2350
      - name: Size
        run: arm-none-eabi-size build/rp2350/tests/smoke.elf
